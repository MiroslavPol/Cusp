# Builds the app and publishes pwa/ to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build.py
      - name: Test before publishing (a failing test keeps the old version online)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/test_app.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pwa
      # GitHub sometimes doesn't yet see the artifact uploaded seconds earlier ("No artifacts named
      # github-pages were found"). Then wait and try once more; a second failure fails the run.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before trying the deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy (second try)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
