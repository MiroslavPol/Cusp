<nav class="tabbar" aria-label="Sections">
  <button class="tab" type="button" data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 4.5C12.5 7 9 12 4 12c5 0 8.5 5 13.5 7.5"/><circle cx="4" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    <span id="tabHomeLabel">Home</span>
  </button>
  <button class="tab" type="button" data-view="learn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M7 10.6V15c0 1.4 2.2 3 5 3s5-1.6 5-3v-4.4"/><path d="M21 8.5V14"/></svg>
    <span id="tabLearnLabel">Learn</span>
  </button>
  <button class="tab" type="button" data-view="feed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg>
    <span id="tabFeedLabel">Feed</span>
  </button>
</nav>

<div class="sheet-wrap" id="courseSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Choose a course</h2>
    <div id="courseList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
</div>

<div class="lesson" id="lesson" hidden role="dialog" aria-modal="true" aria-label="Lesson">
  <div class="lesson-top">
    <button class="x-btn" id="lessonClose" type="button" aria-label="Close lesson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="bar" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100"><span id="lessonBar"></span></div>
    <div class="hearts" id="lessonHearts" role="img" hidden></div>
  </div>
  <div class="lesson-body" id="lessonBody"></div>
  <div class="lesson-foot" id="lessonFoot">
    <div class="foot-inner">
      <div class="fb" id="fb" hidden></div>
      <div class="foot-btns">
        <button class="secondary" id="secondary" type="button" hidden></button>
        <button class="primary" id="primary" type="button">Check</button>
      </div>
    </div>
  </div>
</div>

<div class="guide" id="guide" hidden role="dialog" aria-modal="true" aria-labelledby="guideTitle">
  <div class="guide-top">
    <button class="x-btn" id="guideClose" type="button" aria-label="Zavřít Průvodce"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="guide-h"><span class="guide-k" id="guideKicker">Sprievodca</span><h2 id="guideTitle"></h2></div>
  </div>
  <div class="guide-body" id="guideBody"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- shown at launch for a few seconds: Cusp is only complementary material (main.js fills the text and runs the timer) -->
<div class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="splashK">
  <div class="splash-in">
    <svg class="splash-cusp" viewBox="0 0 120 80" aria-hidden="true"><path pathLength="1" d="M80 6C58 40 40 40 40 40C40 40 58 40 80 74"/><circle cx="40" cy="40" r="4"/></svg>
    <div class="splash-title">Cusp</div>
    <div class="splash-k" id="splashK"></div>
    <p class="splash-text" id="splashText"></p>
    <button class="splash-go" id="splashGo" type="button"></button>
    <div class="splash-timer" aria-hidden="true"><span id="splashBar"></span></div>
  </div>
</div>
